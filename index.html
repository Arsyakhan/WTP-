<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Grade 3D WTP Simulation V2 (Piping & Flow)</title>
    <style>
        :root {
            --bg-main: #060913;
            --panel-bg: rgba(9, 14, 23, 0.9);
            --panel-border: #1a2a40;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.5);
            --danger: #ff4757;
            --success: #2ed573;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        body {
            background: radial-gradient(circle at center, #0f172a 0%, var(--bg-main) 100%);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SCADA HUD Layout */
        #sidebar {
            width: 280px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 10;
            box-shadow: 5px 0 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        #viewport {
            flex: 1;
            position: relative;
        }

        #info-panel {
            width: 420px;
            background: var(--panel-bg);
            border-left: 1px solid var(--panel-border);
            padding: 25px;
            overflow-y: auto;
            z-index: 10;
            box-shadow: -5px 0 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        /* Nav Design */
        .sidebar-header {
            padding: 25px 20px;
            border-bottom: 1px solid var(--panel-border);
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 18px 20px;
            text-align: left;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            letter-spacing: 1px;
            position: relative;
        }

        .nav-btn::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 1px;
            background: linear-gradient(90deg, var(--panel-border) 0%, transparent 100%);
        }

        .nav-btn:hover {
            background: rgba(0, 210, 255, 0.05);
            color: var(--text-main);
            padding-left: 25px;
        }

        .nav-btn.active {
            background: rgba(0, 210, 255, 0.15);
            color: var(--accent);
            border-left-color: var(--accent);
            font-weight: bold;
            text-shadow: 0 0 8px var(--accent-glow);
        }

        /* Details Typography */
        h2 { font-size: 1.5rem; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; border-bottom: 2px solid var(--panel-border); padding-bottom: 10px; }
        h3 { font-size: 0.9rem; text-transform: uppercase; color: var(--text-muted); margin: 20px 0 10px; letter-spacing: 1px; }
        p { font-size: 0.9rem; line-height: 1.6; margin-bottom: 15px; font-family: 'Segoe UI', system-ui, sans-serif; color: #cbd5e1; }
        
        .io-container {
            border: 1px solid var(--panel-border);
            background: rgba(0,0,0,0.4);
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 15px;
            position: relative;
        }
        .io-container::before { content: ''; position: absolute; top: -1px; left: -1px; width: 10px; height: 10px; border-top: 2px solid var(--text-muted); border-left: 2px solid var(--text-muted); }
        .io-container::after { content: ''; position: absolute; bottom: -1px; right: -1px; width: 10px; height: 10px; border-bottom: 2px solid var(--text-muted); border-right: 2px solid var(--text-muted); }

        .io-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
        .color-box { width: 12px; height: 12px; border-radius: 2px; display: inline-block; }
        
        .c-feed { background: #00d2ff; box-shadow: 0 0 8px #00d2ff; }
        .c-prod { background: #2ed573; box-shadow: 0 0 8px #2ed573; }
        .c-rej { background: #ff4757; box-shadow: 0 0 8px #ff4757; }

        .input-title { color: var(--accent); }
        .output-title { color: var(--success); }
        .reject-title { color: var(--danger); }
        
        .io-detail { font-size: 0.9rem; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; }
        .io-detail ul { margin-left: 20px; margin-top: 5px; }
        .io-detail li { margin-bottom: 4px; }

        .sys-badge {
            display: inline-block;
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 3px;
            font-size: 0.75rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        #canvas-container { width: 100%; height: 100%; }

        .hud-overlay {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(9, 14, 23, 0.8);
            border: 1px solid var(--panel-border);
            padding: 12px 24px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: var(--accent);
            pointer-events: none;
            text-align: center;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.2);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); }
        ::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
    <!-- Three.js (Core & OrbitControls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <nav id="sidebar">
        <div class="sidebar-header">WTP.SYS // V2.0</div>
        <div id="nav-container"></div>
    </nav>

    <main id="viewport">
        <div id="canvas-container"></div>
        <div class="hud-overlay">
            [ L-CLICK ]: ROTATE &nbsp;|&nbsp; [ R-CLICK ]: PAN &nbsp;|&nbsp; [ SCROLL ]: ZOOM
        </div>
    </main>

    <aside id="info-panel">
        <span class="sys-badge" id="p-badge">SYS.READY</span>
        <h2 id="p-title">System WTP</h2>
        <p id="p-desc">Pilih modul di terminal navigasi untuk memuat model 3D P&ID dan simulasi aliran fluida.</p>
        
        <div id="p-details" style="display: none;">
            <div class="io-container">
                <div class="io-title input-title"><span class="color-box c-feed"></span> >> INLET [ FEED ]</div>
                <div class="io-detail" id="p-input"></div>
            </div>

            <div class="io-container">
                <div class="io-title output-title"><span class="color-box c-prod"></span> >> OUTLET [ PRODUCT ]</div>
                <div class="io-detail" id="p-output"></div>
            </div>

            <div class="io-container">
                <div class="io-title reject-title"><span class="color-box c-rej"></span> >> REJECT / FLUSH</div>
                <div class="io-detail" id="p-reject"></div>
            </div>

            <h3>// CORE_MECHANISM</h3>
            <p id="p-mech" style="background: rgba(0,0,0,0.5); padding: 15px; border-left: 2px solid var(--accent); font-family: 'Segoe UI';"></p>
        </div>
    </aside>

    <script>
        const wtpData = [
            {
                id: 1, name: "MOD_01 : CLARIFIER", title: "Clarifier Tank", badge: "UNIT.01_GRAVITY",
                desc: "Pemisahan padatan tersuspensi. Air masuk via pipa pusat, overflow air bersih, drainase lumpur bawah.",
                input: "<ul><li>Feed: Raw Water (Biru)</li><li>Bahan Kimia: Koagulan & Flokulan</li></ul>",
                output: "<ul><li>Product: Clarified Water (Hijau) ke overflow weir.</li></ul>",
                reject: "<ul><li>Waste: Lumpur/Sludge padat (Merah) disedot dari kerucut bawah.</li></ul>",
                mech: "Sistem dilengkapi valve bypass. Lengan penyapu (scraper) berputar perlahan mendorong endapan lumpur pekat ke ceruk tengah agar bisa di-blowdown melalui pipa reject bawah."
            },
            {
                id: 2, name: "MOD_02 : MULTIMEDIA", title: "Multimedia Filter", badge: "UNIT.02_FILTRATION",
                desc: "Pressure vessel dengan manifold perpipaan lengkap untuk operasi Filtrasi dan Backwash.",
                input: "<ul><li>Feed: Clarified Water masuk dari pipa atas (Top In).</li></ul>",
                output: "<ul><li>Product: Filtered Water keluar dari pipa bawah (Bottom Out).</li></ul>",
                reject: "<ul><li>Flush/Backwash: Aliran dibalik dari bawah ke atas, kotoran dibuang via pipa pembuangan atas (Merah).</li></ul>",
                mech: "Perhatikan jaringan pipa (manifold) di depan tangki. Terdapat valve untuk mengatur mode operasi normal (downflow) dan mode pencucian/backwash (upflow)."
            },
            {
                id: 3, name: "MOD_03 : CARBON", title: "Activated Carbon", badge: "UNIT.03_ADSORPTION",
                desc: "Tangki filter karbon untuk menyerap klorin dan materi organik.",
                input: "<ul><li>Feed: Filtered Water tinggi klorin.</li></ul>",
                output: "<ul><li>Product: Air bebas klorin dan bau.</li></ul>",
                reject: "<ul><li>Flush: Pipa drainase untuk pembilasan awal (initial rinse).</li></ul>",
                mech: "Manifold identik dengan MMF, namun difokuskan pada reaksi pengikatan molekuler. Karbon aktif melindungi membran RO dari kerusakan kimiawi."
            },
            {
                id: 4, name: "MOD_04 : SOFTENER", title: "Ion Softener", badge: "UNIT.04_ION_EXCHANGE",
                desc: "Tangki penukar ion yang dilengkapi jalur pipa regenerasi khusus (Brine Line).",
                input: "<ul><li>Feed: Air Sadah (Kalsium/Magnesium tinggi).</li><li>Regenerant: Pipa injeksi NaCl (Garam).</li></ul>",
                output: "<ul><li>Product: Soft Water (Air Lunak).</li></ul>",
                reject: "<ul><li>Waste: Limbah pekat kalsium klorida dari proses pencucian resin.</li></ul>",
                mech: "Berbeda dari filter biasa, softener memiliki valve injeksi kimia tambahan di manifold untuk menyedot larutan garam saat resin sudah jenuh (exhausted)."
            },
            {
                id: 5, name: "MOD_05 : ULTRAFILTRATION", title: "Ultrafiltration", badge: "UNIT.05_MEMBRANE",
                desc: "Skid membran UF vertikal dengan perpipaan header-distributor.",
                input: "<ul><li>Feed: Soft Water masuk ke header bawah modul.</li></ul>",
                output: "<ul><li>Product: Air bebas koloid/bakteri keluar dari header atas.</li></ul>",
                reject: "<ul><li>Flush: Aliran cross-flow buangan (Reject) menyapu permukaan membran secara kontinu.</li></ul>",
                mech: "Air dibagi ke beberapa modul membran secara paralel melalui pipa header utama (biru). Reject/Konsentrat (merah) dikumpulkan di header pembuangan khusus."
            },
            {
                id: 6, name: "MOD_06 : REVERSE OSMOSIS", title: "Reverse Osmosis", badge: "UNIT.06_HIGH_PRESSURE",
                desc: "Sistem perpipaan tekanan tinggi untuk pemisahan TDS secara absolut.",
                input: "<ul><li>Feed: Air bertekanan sangat tinggi dari High Pressure Pump (HPP).</li></ul>",
                output: "<ul><li>Product: Permeate (Air murni TDS rendah).</li></ul>",
                reject: "<ul><li>Reject (Brine): Garam konsentrat dibuang melalui Pressure Control Valve (PCV).</li></ul>",
                mech: "Desain vessel horizontal. Air umpan ditekan menembus membran. Pipa tengah mengumpulkan air murni (Permeate - Hijau), sementara pipa ujung membuang konsentrat (Reject - Merah)."
            },
            {
                id: 7, name: "MOD_07 : MIXED BED", title: "Mixed Bed Demin", badge: "UNIT.07_POLISHING",
                desc: "Sistem polishing ganda untuk menghasilkan Ultrapure Water.",
                input: "<ul><li>Feed: RO Permeate.</li><li>Regenerant: Manifold injeksi HCL & NaOH.</li></ul>",
                output: "<ul><li>Product: Ultrapure Water (< 0.1 µS/cm).</li></ul>",
                reject: "<ul><li>Waste: Limbah asam dan basa penetralan.</li></ul>",
                mech: "Karena berisi dua jenis resin (Kation & Anion) dalam satu tangki, perpipaannya sangat kompleks. Terdapat jalur inlet tengah khusus untuk mendistribusikan bahan kimia regenerasi ke masing-masing lapisan resin."
            }
        ];

        // --- 1. THREE.JS ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // --- 2. LIGHTING ---
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.5);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(15, 25, 15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        scene.add(dirLight);

        // --- 3. MATERIALS ---
        const darkSteel = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.7, metalness: 0.3 });
        const pipePVC = new THREE.MeshPhysicalMaterial({ color: 0x334155, transmission: 0.7, opacity: 0.8, transparent: true, roughness: 0.1, metalness: 0.1 });
        const valveBodyMat = new THREE.MeshStandardMaterial({ color: 0x475569, metalness: 0.5 });
        const valveWheelFeed = new THREE.MeshStandardMaterial({ color: 0x0ea5e9 }); // Blue
        const valveWheelRej = new THREE.MeshStandardMaterial({ color: 0xef4444 }); // Red
        
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xcbe3f7, transmission: 0.95, ior: 1.5, thickness: 0.5, roughness: 0.05, transparent: true });

        // --- 4. ENGINE CORE: PIPING & FLOW PARTICLES ---
        let currentGroup = new THREE.Group();
        scene.add(currentGroup);
        
        // Floor
        const grid = new THREE.GridHelper(50, 50, 0x1e293b, 0x0f172a);
        grid.position.y = -0.01;
        scene.add(grid);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ color: 0x060913 }));
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Flow Particle System Arrays
        let activeFlows = [];

        // Utility: Create a Valve
        function createValve(position, rotationAxis, angle, type = 'feed') {
            const vGroup = new THREE.Group();
            
            // Flanges
            const flangeGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            const f1 = new THREE.Mesh(flangeGeo, darkSteel); f1.position.y = 0.3; vGroup.add(f1);
            const f2 = new THREE.Mesh(flangeGeo, darkSteel); f2.position.y = -0.3; vGroup.add(f2);
            
            // Body
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.6, 16), valveBodyMat);
            vGroup.add(body);

            // Stem & Actuator
            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.8, 8), darkSteel);
            stem.rotation.x = Math.PI/2;
            stem.position.z = 0.4;
            vGroup.add(stem);

            const wheelGeo = new THREE.TorusGeometry(0.3, 0.06, 8, 16);
            const wheelMat = type === 'reject' ? valveWheelRej : valveWheelFeed;
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.x = Math.PI/2;
            wheel.position.z = 0.8;
            vGroup.add(wheel);

            vGroup.position.copy(position);
            
            if(rotationAxis === 'x') vGroup.rotation.x = angle;
            else if(rotationAxis === 'z') vGroup.rotation.z = angle;
            else if(rotationAxis === 'y') vGroup.rotation.y = angle;

            return vGroup;
        }

        // Utility: Create Piping Route (Array of Vector3 points)
        function createPipeRoute(points, radius, flowColorHex, flowSpeed = 0.02, addValvesAt = []) {
            // Draw physical pipes and elbows
            for(let i=0; i<points.length-1; i++) {
                const p1 = points[i];
                const p2 = points[i+1];
                const dist = p1.distanceTo(p2);
                
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dist, 16), pipePVC);
                pipe.position.copy(p1).lerp(p2, 0.5);
                pipe.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), p2.clone().sub(p1).normalize());
                pipe.castShadow = true;
                currentGroup.add(pipe);

                // Elbow Joint
                const elbow = new THREE.Mesh(new THREE.SphereGeometry(radius*1.1, 16, 16), pipePVC);
                elbow.position.copy(p1);
                currentGroup.add(elbow);

                // Valves
                if(addValvesAt.includes(i)) {
                    // Determine rotation based on pipe direction
                    const dir = p2.clone().sub(p1).normalize();
                    let axis = 'y', angle = 0;
                    if(Math.abs(dir.x) > 0.5) { axis = 'z'; angle = Math.PI/2; }
                    else if(Math.abs(dir.z) > 0.5) { axis = 'x'; angle = Math.PI/2; }
                    
                    const vType = flowColorHex === 0xff4757 ? 'reject' : 'feed';
                    currentGroup.add(createValve(pipe.position, axis, angle, vType));
                }
            }
            
            const finalElbow = new THREE.Mesh(new THREE.SphereGeometry(radius*1.1, 16, 16), pipePVC);
            finalElbow.position.copy(points[points.length-1]);
            currentGroup.add(finalElbow);

            // Flow Particles Engine
            if(flowColorHex) {
                const flowData = {
                    segments: [], totalLength: 0, 
                    particles: [], speed: flowSpeed, color: flowColorHex
                };
                
                // Calculate segment lengths
                for(let i=0; i<points.length-1; i++) {
                    const l = points[i].distanceTo(points[i+1]);
                    flowData.segments.push({ p1: points[i], p2: points[i+1], length: l, acc: flowData.totalLength });
                    flowData.totalLength += l;
                }

                // Create particle meshes (Glowing spheres inside the pipe)
                const pMat = new THREE.MeshBasicMaterial({ color: flowColorHex });
                const numParticles = Math.floor(flowData.totalLength * 2); // Density
                
                for(let i=0; i<numParticles; i++) {
                    const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius*0.6, 8, 8), pMat);
                    const progress = i / numParticles;
                    flowData.particles.push({ mesh, progress });
                    currentGroup.add(mesh);
                }
                activeFlows.push(flowData);
            }
        }

        // Advanced Vessel Builder
        function buildPressureVessel(x, z, radius, height, material) {
            const vessel = new THREE.Group();
            vessel.position.set(x, 0, z);

            const body = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, height, 32), material);
            body.position.y = height/2 + 1.5;
            body.castShadow = true; vessel.add(body);

            const domeGeo = new THREE.SphereGeometry(radius, 32, 16, 0, Math.PI*2, 0, Math.PI/2);
            const topDome = new THREE.Mesh(domeGeo, material);
            topDome.position.y = height + 1.5;
            topDome.scale.y = 0.4; vessel.add(topDome);

            const botDome = new THREE.Mesh(domeGeo, material);
            botDome.rotation.x = Math.PI;
            botDome.position.y = 1.5;
            botDome.scale.y = 0.4; vessel.add(botDome);

            for(let i=0; i<4; i++) {
                const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 1.5, 8), darkSteel);
                const angle = (Math.PI/2)*i;
                leg.position.set(Math.cos(angle)*(radius-0.2), 0.75, Math.sin(angle)*(radius-0.2));
                leg.castShadow = true; vessel.add(leg);
            }
            return vessel;
        }

        function fillFilterMedia(parentGroup, radius, baseHeight, layers) {
            let currentY = baseHeight;
            layers.forEach(layer => {
                const height = layer.h;
                const geo = new THREE.BufferGeometry();
                const pos = new Float32Array(layer.qty * 3);
                for(let i=0; i<layer.qty*3; i+=3) {
                    const r = (radius - 0.1) * Math.sqrt(Math.random());
                    const theta = Math.random() * 2 * Math.PI;
                    pos[i] = r * Math.cos(theta);
                    pos[i+1] = (Math.random() * height) + currentY;
                    pos[i+2] = r * Math.sin(theta);
                }
                geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.PointsMaterial({ color: layer.c, size: layer.s });
                parentGroup.add(new THREE.Points(geo, mat));
                currentY += height;
            });
        }

        // --- 5. MODULE SPECIFIC BUILDERS ---

        function buildClarifier() {
            // Skirt Support
            const skirt = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, 1, 32), darkSteel);
            skirt.position.y = 0.5; currentGroup.add(skirt);

            const tank = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 6, 64, 1, true, 0, Math.PI*1.4), glassMat);
            tank.position.y = 4; currentGroup.add(tank);
            const solidTank = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 6, 64, 1, true, Math.PI*1.4, Math.PI*0.6), darkSteel);
            solidTank.position.y = 4; currentGroup.add(solidTank);

            // Inner water
            const water = new THREE.Mesh(new THREE.CylinderGeometry(3.9, 3.9, 5.5, 32), new THREE.MeshPhysicalMaterial({color:0x00d2ff, transmission:0.8, transparent:true}));
            water.position.y = 3.75; currentGroup.add(water);

            const well = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 4, 32), darkSteel);
            well.position.y = 5; currentGroup.add(well);

            // Piping
            const v = THREE.Vector3;
            // Feed (Blue)
            createPipeRoute([new v(-7, 6, 0), new v(-4, 6, 0), new v(0, 6, 0), new v(0, 4, 0)], 0.25, 0x00d2ff, 0.03, [0]);
            // Product (Green) - Overflow collect
            createPipeRoute([new v(4, 6.5, 0), new v(5, 6.5, 0), new v(5, 1, 0), new v(7, 1, 0)], 0.25, 0x2ed573, 0.03, [2]);
            // Sludge Drain (Red)
            createPipeRoute([new v(0, 1, 0), new v(0, 0.5, 0), new v(-3, 0.5, 0), new v(-3, 0.5, 3)], 0.2, 0xff4757, 0.015, [1]);

            // Scraper Animation
            const scraper = new THREE.Mesh(new THREE.BoxGeometry(7.6, 0.2, 0.4), darkSteel);
            scraper.position.y = 1.2; currentGroup.add(scraper);
            currentGroup.userData.animate = () => { scraper.rotation.y -= 0.01; };

            camera.position.set(10, 10, 12);
            controls.target.set(0, 4, 0);
        }

        function buildManifoldVessel(layersDesc) {
            const v = THREE.Vector3;
            const vessel = buildPressureVessel(0, 0, 2.5, 6, glassMat);
            fillFilterMedia(vessel, 2.5, 2.0, layersDesc);
            currentGroup.add(vessel);

            // Complex P&ID Front Manifold
            const pR = 0.2; // pipe radius
            
            // Feed Line (Top Inlet) - Blue
            createPipeRoute([new v(-5, 8, 3), new v(-2, 8, 3), new v(-2, 7.5, 0), new v(0, 7.5, 0)], pR, 0x00d2ff, 0.04, [0]);
            
            // Product Line (Bottom Outlet) - Green
            createPipeRoute([new v(0, 1.5, 0), new v(2, 1.5, 0), new v(2, 1.5, 3), new v(5, 1.5, 3)], pR, 0x2ed573, 0.04, [2]);

            // Reject / Backwash Waste (Top Outlet -> Drain) - Red
            createPipeRoute([new v(0, 7.5, 0), new v(3, 7.5, 0), new v(3, 7.5, 2), new v(3, 0.5, 2), new v(3, 0.5, 5)], pR, 0xff4757, 0.03, [1]);

            camera.position.set(0, 6, 12);
            controls.target.set(0, 4, 0);
        }

        function buildMMF() {
            buildManifoldVessel([
                { h: 1.5, c: 0x64748b, s: 0.15, qty: 1000 }, // Gravel
                { h: 0.8, c: 0x8b0000, s: 0.04, qty: 2000 }, // Garnet
                { h: 1.5, c: 0xd4a373, s: 0.06, qty: 4000 }, // Sand
                { h: 1.5, c: 0x111111, s: 0.09, qty: 3000 }  // Anthracite
            ]);
        }

        function buildACF() {
            buildManifoldVessel([
                { h: 1.5, c: 0x64748b, s: 0.15, qty: 1000 },
                { h: 4.5, c: 0x050505, s: 0.07, qty: 8000 }  // Carbon
            ]);
        }

        function buildSoftener() {
            buildManifoldVessel([
                { h: 1.5, c: 0x64748b, s: 0.15, qty: 1000 },
                { h: 4.5, c: 0xd97706, s: 0.06, qty: 8000 }  // Cation
            ]);
            // Add Brine Injection Line
            const v = THREE.Vector3;
            createPipeRoute([new v(-3, 0.5, -3), new v(-3, 5, -3), new v(0, 5, -3), new v(0, 5, 0)], 0.1, 0xd97706, 0.02, [1]);
        }

        function buildUF() {
            const v = THREE.Vector3;
            const skid = new THREE.Mesh(new THREE.BoxGeometry(6, 0.5, 3), darkSteel);
            skid.position.y = 0.25; currentGroup.add(skid);

            // UF Modules
            for(let i=0; i<4; i++) {
                const m = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 5, 32), glassMat);
                m.position.set(-2 + i*1.3, 3, 0);
                
                // Fibers
                for(let f=0; f<10; f++) {
                    const fb = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 5, 8), new THREE.MeshBasicMaterial({color:0xffffff}));
                    fb.position.set((Math.random()-0.5)*0.4, 0, (Math.random()-0.5)*0.4);
                    m.add(fb);
                }
                currentGroup.add(m);

                // Connections to headers
                const x = -2 + i*1.3;
                createPipeRoute([new v(x, 0.5, 1), new v(x, 0.5, 0)], 0.1, null, 0); // Bottom feed tap
                createPipeRoute([new v(x, 5.5, 0), new v(x, 5.5, -1)], 0.1, null, 0); // Top prod tap
                createPipeRoute([new v(x, 5.0, 0), new v(x, 5.0, 1)], 0.1, null, 0); // Side reject tap
            }

            // Headers
            // Feed (Bottom)
            createPipeRoute([new v(-4, 0.5, 1), new v(3, 0.5, 1)], 0.2, 0x00d2ff, 0.04, [0]);
            // Product (Top Back)
            createPipeRoute([new v(-3, 5.5, -1), new v(4, 5.5, -1)], 0.2, 0x2ed573, 0.04, [0]);
            // Reject (Top Front)
            createPipeRoute([new v(-3, 5.0, 1), new v(4, 5.0, 1), new v(4, 1.0, 1), new v(4, 1.0, 3)], 0.15, 0xff4757, 0.03, [2]);

            camera.position.set(6, 6, 10);
            controls.target.set(0, 3, 0);
        }

        function buildRO() {
            const v = THREE.Vector3;
            const skid = new THREE.Mesh(new THREE.BoxGeometry(8, 0.5, 5), darkSteel);
            skid.position.y = 0.25; currentGroup.add(skid);

            // Pressure Vessels (Horizontal)
            for(let i=0; i<3; i++) {
                const z = -1.5 + i*1.5;
                const m = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 6, 32), glassMat);
                m.rotation.z = Math.PI/2; m.position.set(0, 2, z);
                currentGroup.add(m);

                // Spirals
                const wrap = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 5.8, 16), new THREE.MeshStandardMaterial({color:0xe2e8f0, wireframe:true}));
                m.add(wrap);

                // Taps
                createPipeRoute([new v(-3.5, 2, z), new v(-3, 2, z)], 0.1, null, 0); // Feed In
                createPipeRoute([new v(3, 2, z), new v(3.5, 2, z)], 0.1, null, 0); // Brine Out
                createPipeRoute([new v(3, 2, z), new v(3, 3, z)], 0.08, null, 0); // Permeate Out
            }

            // High Pressure Feed Header (Left) - Blue
            createPipeRoute([new v(-4.5, 0.5, 0), new v(-3.5, 0.5, 0), new v(-3.5, 2, -1.5), new v(-3.5, 2, 1.5)], 0.2, 0x00d2ff, 0.06, [0]);
            
            // Permeate Header (Top Right) - Green
            createPipeRoute([new v(3, 3, -1.5), new v(3, 3, 1.5), new v(3, 3, 2.5), new v(4.5, 3, 2.5)], 0.15, 0x2ed573, 0.04, []);
            
            // Brine Reject Header (Right) - Red with PCV
            createPipeRoute([new v(3.5, 2, -1.5), new v(3.5, 2, 1.5), new v(3.5, 0.5, 1.5), new v(4.5, 0.5, 1.5)], 0.2, 0xff4757, 0.03, [2]);

            camera.position.set(8, 6, 10);
            controls.target.set(0, 2, 0);
        }

        function buildMixedBed() {
            buildManifoldVessel([
                { h: 1.5, c: 0x64748b, s: 0.15, qty: 1000 },
                { h: 4.5, c: 0xffffff, s: 0.06, qty: 8000 } 
            ]);
            // Override with mixed color
            const resinLayer = currentGroup.children[0].children[currentGroup.children[0].children.length - 1];
            const colors = new Float32Array(8000 * 3);
            const c1 = new THREE.Color(0xd97706); const c2 = new THREE.Color(0xfde047);
            for(let i=0; i<8000; i++) {
                const c = Math.random() > 0.5 ? c1 : c2;
                colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
            }
            resinLayer.geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            resinLayer.material.vertexColors = true;
            resinLayer.material.color = new THREE.Color(0xffffff);
        }

        // --- 6. CORE LOGIC ---
        function clearScene() {
            while(currentGroup.children.length > 0) currentGroup.remove(currentGroup.children[0]);
            currentGroup.userData = {};
            activeFlows = []; // Clear flow particles
        }

        function loadStage(id) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + id).classList.add('active');
            
            const data = wtpData.find(d => d.id === id);
            document.getElementById('p-title').innerHTML = data.title;
            document.getElementById('p-badge').innerHTML = data.badge;
            document.getElementById('p-desc').innerHTML = data.desc;
            document.getElementById('p-details').style.display = 'block';
            document.getElementById('p-input').innerHTML = data.input;
            document.getElementById('p-output').innerHTML = data.output;
            document.getElementById('p-reject').innerHTML = data.reject;
            document.getElementById('p-mech').innerHTML = data.mech;

            clearScene();
            
            switch(id) {
                case 1: buildClarifier(); break;
                case 2: buildMMF(); break;
                case 3: buildACF(); break;
                case 4: buildSoftener(); break;
                case 5: buildUF(); break;
                case 6: buildRO(); break;
                case 7: buildMixedBed(); break;
            }
        }

        const navContainer = document.getElementById('nav-container');
        wtpData.forEach(stage => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn';
            btn.id = 'btn-' + stage.id;
            btn.innerText = stage.name;
            btn.onclick = () => loadStage(stage.id);
            navContainer.appendChild(btn);
        });

        // Compute Particle Position along path
        function getPositionAlongPath(flowData, progress) {
            const targetDistance = progress * flowData.totalLength;
            let currentDist = 0;
            for(let i=0; i<flowData.segments.length; i++) {
                const seg = flowData.segments[i];
                if(targetDistance <= currentDist + seg.length) {
                    const localProg = (targetDistance - currentDist) / seg.length;
                    return seg.p1.clone().lerp(seg.p2, localProg);
                }
                currentDist += seg.length;
            }
            return flowData.segments[flowData.segments.length-1].p2.clone();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Custom mechanical animations (like scraper)
            if(currentGroup.userData.animate) currentGroup.userData.animate();

            // Flow Particles Animation
            activeFlows.forEach(flow => {
                flow.particles.forEach(p => {
                    p.progress += flow.speed;
                    if(p.progress > 1) p.progress = 0; // Loop back
                    const pos = getPositionAlongPath(flow, p.progress);
                    p.mesh.position.copy(pos);
                });
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Initialize First State
        loadStage(1);
        animate();
    </script>
</body>
</html>
