<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro-Grade 3D WTP - Flow & Valve Simulation</title>
    <style>
        :root {
            --bg-main: #060913;
            --panel-bg: rgba(9, 14, 23, 0.9);
            --panel-border: #1a2a40;
            --text-main: #e2e8f0;
            --text-muted: #64748b;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.5);
            --danger: #ff4757;
            --success: #2ed573;
            --warning: #feca57;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; }

        body {
            background: radial-gradient(circle at center, #0f172a 0%, var(--bg-main) 100%);
            color: var(--text-main);
            display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar UI */
        #sidebar {
            width: 300px; background: var(--panel-bg); border-right: 1px solid var(--panel-border);
            display: flex; flex-direction: column; z-index: 10; box-shadow: 5px 0 20px rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
        }

        #viewport { flex: 1; position: relative; }

        /* SCADA HUD */
        .sidebar-header {
            padding: 25px 20px; border-bottom: 1px solid var(--panel-border);
            font-weight: bold; font-size: 1.1rem; color: var(--accent);
            text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px var(--accent-glow);
        }

        .nav-btn {
            background: none; border: none; color: var(--text-muted);
            padding: 18px 20px; text-align: left; cursor: pointer;
            border-left: 4px solid transparent; transition: all 0.3s ease;
            font-size: 0.95rem; letter-spacing: 1px; position: relative;
        }
        .nav-btn::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, var(--panel-border) 0%, transparent 100%); }
        .nav-btn:hover { background: rgba(0, 210, 255, 0.05); color: var(--text-main); padding-left: 25px; }
        .nav-btn.active { background: rgba(0, 210, 255, 0.15); color: var(--accent); border-left-color: var(--accent); font-weight: bold; text-shadow: 0 0 8px var(--accent-glow); }

        /* Operation Control Panel (Floating on Canvas) */
        #ops-panel {
            position: absolute; top: 25px; right: 25px;
            background: rgba(13, 20, 36, 0.85); border: 1px solid var(--accent);
            padding: 20px; border-radius: 4px; box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
            backdrop-filter: blur(5px); z-index: 20; min-width: 250px;
        }
        .ops-header {
            font-size: 0.85rem; color: var(--accent); margin-bottom: 15px;
            text-transform: uppercase; border-bottom: 1px solid var(--panel-border); padding-bottom: 5px;
            letter-spacing: 2px; display: flex; justify-content: space-between; align-items: center;
        }
        .ops-header::after { content: '● REC'; color: var(--danger); font-size: 0.7rem; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }

        .ops-btn {
            display: block; width: 100%; background: #1a2a40; border: 1px solid #2c3e50;
            color: #cbd5e1; padding: 12px; margin-bottom: 10px; cursor: pointer;
            text-transform: uppercase; font-weight: bold; font-size: 0.85rem;
            transition: all 0.2s; border-radius: 2px; text-align: left;
            position: relative; overflow: hidden;
        }
        .ops-btn::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: transparent; }
        .ops-btn:hover { background: #23354f; }
        
        .ops-btn.active-service { background: rgba(46, 213, 115, 0.15); border-color: var(--success); color: var(--success); }
        .ops-btn.active-service::before { background: var(--success); }
        
        .ops-btn.active-reject { background: rgba(255, 71, 87, 0.15); border-color: var(--danger); color: var(--danger); }
        .ops-btn.active-reject::before { background: var(--danger); }
        
        .ops-btn.active-regen { background: rgba(254, 202, 87, 0.15); border-color: var(--warning); color: var(--warning); }
        .ops-btn.active-regen::before { background: var(--warning); }

        /* Description Box inside Canvas */
        #flow-desc {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            background: rgba(9, 14, 23, 0.9); border: 1px solid var(--panel-border);
            padding: 15px 25px; border-radius: 4px; color: #e2e8f0; pointer-events: none;
            text-align: center; width: 60%; box-shadow: 0 0 15px rgba(0,0,0,0.8);
            font-family: 'Segoe UI', sans-serif; font-size: 0.95rem; line-height: 1.5;
        }
        .valve-legend {
            margin-top: 10px; font-family: 'Consolas', monospace; font-size: 0.8rem;
            color: var(--text-muted); display: flex; justify-content: center; gap: 20px;
        }
        .v-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }

    </style>
    <!-- Three.js (Core & OrbitControls) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <nav id="sidebar">
        <div class="sidebar-header">WTP.SYS // V3.0<br><span style="font-size:0.7rem; color:var(--text-muted)">HMI CONTROL PANEL</span></div>
        <div id="nav-container"></div>
    </nav>

    <main id="viewport">
        <div id="canvas-container"></div>
        
        <!-- Interactive SCADA Operation Panel -->
        <div id="ops-panel">
            <div class="ops-header">Operation Mode</div>
            <div id="btn-container">
                <!-- Buttons injected by JS based on module -->
            </div>
        </div>

        <!-- Dynamic Flow Description -->
        <div id="flow-desc">
            <div id="flow-text">Pilih mode operasional di sudut kanan atas.</div>
            <div class="valve-legend">
                <span><span class="v-indicator" style="background:var(--success); box-shadow: 0 0 5px var(--success)"></span>Valve OPEN (Flowing)</span>
                <span><span class="v-indicator" style="background:var(--danger); box-shadow: 0 0 5px var(--danger)"></span>Valve CLOSED (Blocked)</span>
            </div>
        </div>
    </main>

    <script>
        // Data Sistem dan Mode Operasional
        const wtpData = [
            {
                id: 1, name: "MOD_01 : CLARIFIER", builder: buildClarifier,
                modes: [
                    { id: 'service', label: '1. NORMAL SERVICE', type: 'service', desc: '<b>[SERVICE]</b> Air baku masuk dari pusat, mengalir pelan ke atas (overflow) menjadi air bersih. Valve inlet dan outlet hijau terbuka.' },
                    { id: 'desludge', label: '2. BLOWDOWN SLUDGE', type: 'reject', desc: '<b>[DESLUDGE]</b> Valve pembuangan bawah dibuka paksa. Lumpur padat dari dasar clarifier disedot keluar melalui jalur merah.' }
                ]
            },
            {
                id: 2, name: "MOD_02 : MULTIMEDIA", builder: buildMMF,
                modes: [
                    { id: 'service', label: '1. DOWNFLOW SERVICE', type: 'service', desc: '<b>[SERVICE]</b> Valve Top-In & Bottom-Out Terbuka. Air mengalir turun melewati media pasir menyaring kotoran fisik.' },
                    { id: 'backwash', label: '2. UPFLOW BACKWASH', type: 'reject', desc: '<b>[BACKWASH]</b> Valve Bottom-In & Top-Out Drain Terbuka. Aliran ditekan dari bawah ke atas mengaduk media dan membuang kotoran yang terjebak ke saluran pembuangan.' }
                ]
            },
            {
                id: 3, name: "MOD_03 : CARBON", builder: buildACF,
                modes: [
                    { id: 'service', label: '1. ADSORPTION SERVICE', type: 'service', desc: '<b>[SERVICE]</b> Aliran normal. Pori karbon aktif menyerap klorin dan zat organik secara kimiawi.' },
                    { id: 'backwash', label: '2. MEDIA BACKWASH', type: 'reject', desc: '<b>[BACKWASH]</b> Pencucian aliran balik untuk mengangkat debu karbon yang hancur dan mengurangi pemadatan media (compaction).' }
                ]
            },
            {
                id: 4, name: "MOD_04 : SOFTENER", builder: buildSoftener,
                modes: [
                    { id: 'service', label: '1. SOFTENING SERVICE', type: 'service', desc: '<b>[SERVICE]</b> Resin mengikat kalsium/magnesium, melepas sodium. Menghasilkan Soft Water.' },
                    { id: 'regen', label: '2. BRINE REGENERATION', type: 'regen', desc: '<b>[REGENERATION]</b> Valve injeksi garam (Kuning) terbuka. Brine pekat menyapu resin, memaksa kalsium lepas dan terbuang lewat valve drain bawah.' },
                    { id: 'backwash', label: '3. FAST RINSE', type: 'reject', desc: '<b>[FAST RINSE]</b> Pembilasan cepat untuk menghilangkan sisa garam di dalam tangki sebelum kembali ke mode service.' }
                ]
            }
        ];

        // --- 1. ENGINE SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.4));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(15, 25, 15); dirLight.castShadow = true;
        scene.add(dirLight);

        // Materials
        const pipePVC = new THREE.MeshPhysicalMaterial({ color: 0x334155, transmission: 0.8, opacity: 0.7, transparent: true, roughness: 0.1 });
        const darkSteel = new THREE.MeshStandardMaterial({ color: 0x1f2937, roughness: 0.7 });
        const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xcbe3f7, transmission: 0.95, ior: 1.5, thickness: 0.5, roughness: 0.05, transparent: true, side: THREE.DoubleSide });

        // Global State
        let currentGroup = new THREE.Group();
        scene.add(currentGroup);
        
        const grid = new THREE.GridHelper(50, 50, 0x1e293b, 0x0f172a); grid.position.y = -0.01; scene.add(grid);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ color: 0x060913 }));
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        // System Managers
        let valves = {};         // Store valves by ID
        let particleGroups = {}; // Store flow particles by Mode ID

        // --- 2. COMPONENTS BUILDERS ---

        // Create an operable SCADA Valve
        function createValve(position, rotationAxis, angle, id, label) {
            const vGroup = new THREE.Group();
            
            // Flanges & Body
            const flangeGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            const f1 = new THREE.Mesh(flangeGeo, darkSteel); f1.position.y = 0.3; vGroup.add(f1);
            const f2 = new THREE.Mesh(flangeGeo, darkSteel); f2.position.y = -0.3; vGroup.add(f2);
            vGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.6, 16), new THREE.MeshStandardMaterial({color: 0x475569})));

            // Actuator Box
            const actuator = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.6), darkSteel);
            actuator.position.z = 0.5; actuator.rotation.x = Math.PI/2;
            vGroup.add(actuator);

            // LED Status Indicator
            const led = new THREE.Mesh(new THREE.SphereGeometry(0.15, 16, 16), new THREE.MeshBasicMaterial({color: 0xff4757})); // Default Closed (Red)
            led.position.z = 0.75;
            vGroup.add(led);

            vGroup.position.copy(position);
            if(rotationAxis === 'x') vGroup.rotation.x = angle;
            else if(rotationAxis === 'z') vGroup.rotation.z = angle;
            else if(rotationAxis === 'y') vGroup.rotation.y = angle;

            // Operation Method
            vGroup.setOpen = (isOpen) => {
                led.material.color.setHex(isOpen ? 0x2ed573 : 0xff4757); // Green if open, Red if closed
            };

            valves[id] = vGroup;
            currentGroup.add(vGroup);
            return vGroup;
        }

        // Draw physical pipes statically
        function buildStaticPipe(points, radius) {
            for(let i=0; i<points.length-1; i++) {
                const p1 = points[i], p2 = points[i+1], dist = p1.distanceTo(p2);
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dist, 16), pipePVC);
                pipe.position.copy(p1).lerp(p2, 0.5);
                pipe.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), p2.clone().sub(p1).normalize());
                currentGroup.add(pipe);
                
                const elbow = new THREE.Mesh(new THREE.SphereGeometry(radius*1.1, 16, 16), pipePVC);
                elbow.position.copy(p1); currentGroup.add(elbow);
            }
            const finalElbow = new THREE.Mesh(new THREE.SphereGeometry(radius*1.1, 16, 16), pipePVC);
            finalElbow.position.copy(points[points.length-1]); currentGroup.add(finalElbow);
        }

        // Register Flow Route for a specific Mode
        function registerFlow(modeId, points, radius, colorHex, speed = 0.03) {
            if(!particleGroups[modeId]) particleGroups[modeId] = [];

            const flowData = { segments: [], totalLength: 0, particles: [], speed, color: colorHex };
            for(let i=0; i<points.length-1; i++) {
                const l = points[i].distanceTo(points[i+1]);
                flowData.segments.push({ p1: points[i], p2: points[i+1], length: l });
                flowData.totalLength += l;
            }

            const group = new THREE.Group();
            group.visible = false; // Hidden by default
            
            const numParticles = Math.floor(flowData.totalLength * 3);
            const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
            
            for(let i=0; i<numParticles; i++) {
                const mesh = new THREE.Mesh(new THREE.SphereGeometry(radius*0.5, 8, 8), pMat);
                flowData.particles.push({ mesh, progress: i / numParticles });
                group.add(mesh);
            }
            
            particleGroups[modeId].push(flowData);
            currentGroup.add(group);
            flowData.group = group;
        }

        // --- 3. MODULE CONSTRUCTION DESIGNS ---

        function buildClarifier() {
            const v = THREE.Vector3;
            // Build Tank
            const tank = new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 6, 64, 1, true, 0, Math.PI*1.4), glassMat);
            tank.position.y = 4; currentGroup.add(tank);
            currentGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(4, 4, 6, 64, 1, true, Math.PI*1.4, Math.PI*0.6), darkSteel).translateY(4));
            currentGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(3.9, 3.9, 5.5, 32), new THREE.MeshPhysicalMaterial({color:0x00d2ff, transmission:0.8, transparent:true})).translateY(3.75));
            currentGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 4, 32), darkSteel).translateY(5));
            
            // Build Pipes
            const rIn = [new v(-7,6,0), new v(-4,6,0), new v(0,6,0), new v(0,4,0)];
            const rOut = [new v(4,6.5,0), new v(5,6.5,0), new v(5,1,0), new v(7,1,0)];
            const rSludge = [new v(0,1,0), new v(0,0.5,0), new v(-3,0.5,0), new v(-3,0.5,3)];
            
            buildStaticPipe(rIn, 0.25); buildStaticPipe(rOut, 0.25); buildStaticPipe(rSludge, 0.2);
            
            // Valves
            createValve(new v(-4,6,0), 'x', Math.PI/2, 'V_IN');
            createValve(new v(5,3,0), 'y', 0, 'V_OUT');
            createValve(new v(-2,0.5,0), 'x', Math.PI/2, 'V_SLUDGE');

            // Register Flows (Service Mode)
            registerFlow('service', rIn, 0.25, 0x00d2ff);
            registerFlow('service', rOut, 0.25, 0x2ed573);
            
            // Register Flows (Desludge Mode)
            registerFlow('desludge', rIn, 0.25, 0x00d2ff);
            registerFlow('desludge', rOut, 0.25, 0x2ed573); // Keeps running
            registerFlow('desludge', rSludge, 0.2, 0xff4757, 0.05); // Fast sludge blowdown

            camera.position.set(10, 8, 12); controls.target.set(0, 4, 0);
        }

        // Standard Manifold for MMF/ACF
        function buildStandardFilter() {
            const v = THREE.Vector3;
            // Build Vessel & Media
            const vessel = new THREE.Group();
            vessel.add(new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 6, 32), glassMat).translateY(4.5));
            currentGroup.add(vessel);
            
            // Internal Media (Simplified as one block for visual)
            const media = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.4, 4, 32), new THREE.MeshStandardMaterial({color: 0xd4a373, roughness:1}));
            media.position.y = 4; currentGroup.add(media);

            // Piping Routes
            const feedMain = [new v(-6, 7.5, 4), new v(-2, 7.5, 4)];
            const feedTop = [new v(-2, 7.5, 4), new v(-2, 7.5, 0), new v(0, 7.5, 0)];
            const feedBot = [new v(-2, 7.5, 4), new v(-2, 1.5, 4), new v(-2, 1.5, 0), new v(0, 1.5, 0)];
            
            const prodMain = [new v(2, 1.5, 0), new v(2, 1.5, 4), new v(6, 1.5, 4)];
            const drainMain = [new v(2, 7.5, 0), new v(2, 7.5, -3), new v(6, 7.5, -3)];
            
            const internalDown = [new v(0, 7.5, 0), new v(0, 1.5, 0)]; // Service internal
            const internalUp = [new v(0, 1.5, 0), new v(0, 7.5, 0)];   // Backwash internal

            // Build Static Physical Pipes
            buildStaticPipe(feedMain, 0.2); buildStaticPipe(feedTop, 0.2); buildStaticPipe(feedBot, 0.2);
            buildStaticPipe(prodMain, 0.2); buildStaticPipe(drainMain, 0.2);

            // Create Standard 4-Valve Manifold
            createValve(new v(-2, 5.5, 4), 'y', 0, 'V_BW_IN');   // V2: Backwash Inlet (Bottom)
            createValve(new v(-2, 7.5, 2), 'x', Math.PI/2, 'V_IN'); // V1: Service Inlet (Top)
            
            createValve(new v(2, 1.5, 2), 'x', Math.PI/2, 'V_OUT'); // V3: Service Outlet (Bottom)
            createValve(new v(2, 7.5, -1.5), 'x', Math.PI/2, 'V_BW_OUT'); // V4: Backwash Drain (Top)

            // Mode 1: SERVICE (Feed -> V_IN -> Top -> Down -> Bottom -> V_OUT -> Prod)
            registerFlow('service', feedMain.concat(feedTop.slice(1)), 0.2, 0x00d2ff);
            registerFlow('service', internalDown, 0.5, 0x00d2ff, 0.01); // Slow inside tank
            registerFlow('service', [new v(0,1.5,0)].concat(prodMain), 0.2, 0x2ed573);

            // Mode 2: BACKWASH (Feed -> V_BW_IN -> Bottom -> Up -> Top -> V_BW_OUT -> Drain)
            registerFlow('backwash', feedMain.concat(feedBot.slice(1)), 0.2, 0x00d2ff, 0.05);
            registerFlow('backwash', internalUp, 0.6, 0x00d2ff, 0.02); // Agitated inside tank
            registerFlow('backwash', [new v(0,7.5,0)].concat(drainMain), 0.2, 0xff4757, 0.05); // Red waste

            camera.position.set(0, 5, 12); controls.target.set(0, 4.5, 0);
        }

        function buildMMF() { buildStandardFilter(); }
        function buildACF() { buildStandardFilter(); }

        function buildSoftener() {
            buildStandardFilter();
            // Add Brine (Regeneration) Line for Softener
            const v = THREE.Vector3;
            const brineLine = [new v(-5, 0, -2), new v(-3, 0, -2), new v(-3, 7.5, -2), new v(0, 7.5, -2), new v(0, 7.5, 0)];
            buildStaticPipe(brineLine, 0.15);
            createValve(new v(-3, 4, -2), 'y', 0, 'V_BRINE');

            // Mode 3: REGENERATION (Brine -> V_BRINE -> Top -> Down -> Bottom -> V_BW_OUT/Drain)
            registerFlow('regen', brineLine, 0.15, 0xfeca57); // Orange Brine
            registerFlow('regen', [new v(0, 7.5, 0), new v(0, 1.5, 0)], 0.5, 0xfeca57, 0.01); // Brine reacting in tank
            // Using same bottom pipe to drain (simulated as fast rinse out)
            registerFlow('regen', [new v(0,1.5,0), new v(2,1.5,0), new v(2,1.5,-3), new v(6,1.5,-3)], 0.2, 0xff4757);
            
            buildStaticPipe([new v(2,1.5,0), new v(2,1.5,-3), new v(6,1.5,-3)], 0.2); // Extra drain line for softener bottom
            createValve(new v(2, 1.5, -1.5), 'x', Math.PI/2, 'V_DRAIN_BOT');
        }


        // --- 4. OPERATION & ANIMATION LOGIC ---

        function setValveState(id, isOpen) {
            if(valves[id]) valves[id].setOpen(isOpen);
        }

        function activateMode(moduleConfig, mode) {
            // Update UI Buttons
            document.querySelectorAll('.ops-btn').forEach(b => b.className = 'ops-btn');
            document.getElementById(`btn-mode-${mode.id}`).classList.add(`active-${mode.type}`);
            document.getElementById('flow-text').innerHTML = mode.desc;

            // Hide all flows first
            Object.values(particleGroups).forEach(groupArray => {
                groupArray.forEach(flow => flow.group.visible = false);
            });

            // Show active flows
            if(particleGroups[mode.id]) {
                particleGroups[mode.id].forEach(flow => flow.group.visible = true);
            }

            // --- VALVE LOGIC (HARDCODED RULES PER MODULE FOR REALISM) ---
            // Reset all valves to closed first
            Object.keys(valves).forEach(id => setValveState(id, false));

            if(moduleConfig.id === 1) { // Clarifier
                if(mode.id === 'service') { setValveState('V_IN', true); setValveState('V_OUT', true); }
                if(mode.id === 'desludge') { setValveState('V_IN', true); setValveState('V_OUT', true); setValveState('V_SLUDGE', true); }
            }
            
            if(moduleConfig.id === 2 || moduleConfig.id === 3) { // Filter
                if(mode.id === 'service') { setValveState('V_IN', true); setValveState('V_OUT', true); }
                if(mode.id === 'backwash') { setValveState('V_BW_IN', true); setValveState('V_BW_OUT', true); }
            }

            if(moduleConfig.id === 4) { // Softener
                if(mode.id === 'service') { setValveState('V_IN', true); setValveState('V_OUT', true); }
                if(mode.id === 'backwash') { setValveState('V_BW_IN', true); setValveState('V_BW_OUT', true); }
                if(mode.id === 'regen') { setValveState('V_BRINE', true); setValveState('V_DRAIN_BOT', true); }
            }
        }

        function loadModule(id) {
            // Update Sidebar UI
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-nav-' + id).classList.add('active');
            
            const data = wtpData.find(d => d.id === id);
            
            // Clear 3D Scene
            while(currentGroup.children.length > 0) currentGroup.remove(currentGroup.children[0]);
            valves = {}; particleGroups = {}; currentGroup.userData = {};
            
            // Build Module
            data.builder();

            // Setup SCADA Operation Panel Buttons
            const opsContainer = document.getElementById('btn-container');
            opsContainer.innerHTML = '';
            
            data.modes.forEach((mode, index) => {
                const btn = document.createElement('button');
                btn.className = 'ops-btn';
                btn.id = `btn-mode-${mode.id}`;
                btn.innerText = mode.label;
                btn.onclick = () => activateMode(data, mode);
                opsContainer.appendChild(btn);
            });

            // Auto-trigger the first mode (Service)
            if(data.modes.length > 0) activateMode(data, data.modes[0]);
        }

        // Init Navigation
        const navContainer = document.getElementById('nav-container');
        wtpData.forEach(mod => {
            const btn = document.createElement('button');
            btn.className = 'nav-btn'; btn.id = 'btn-nav-' + mod.id;
            btn.innerText = mod.name;
            btn.onclick = () => loadModule(mod.id);
            navContainer.appendChild(btn);
        });

        // Compute Particle Position along path
        function getPositionAlongPath(flowData, progress) {
            const targetDist = progress * flowData.totalLength;
            let currentDist = 0;
            for(let i=0; i<flowData.segments.length; i++) {
                const seg = flowData.segments[i];
                if(targetDist <= currentDist + seg.length) {
                    const localProg = (targetDist - currentDist) / seg.length;
                    return seg.p1.clone().lerp(seg.p2, localProg);
                }
                currentDist += seg.length;
            }
            return flowData.segments[flowData.segments.length-1].p2.clone();
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            if(currentGroup.userData.animate) currentGroup.userData.animate();

            // Animate only visible flow particles
            Object.values(particleGroups).forEach(groupArray => {
                groupArray.forEach(flow => {
                    if(flow.group.visible) {
                        flow.particles.forEach(p => {
                            p.progress += flow.speed;
                            if(p.progress > 1) p.progress = 0;
                            p.mesh.position.copy(getPositionAlongPath(flow, p.progress));
                        });
                    }
                });
            });

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Start
        loadModule(2); // Load MMF by default to show off the manifold
        animate();
    </script>
</body>
</html>
