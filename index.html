<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Twin WTP - Ultimate Edition</title>
    <style>
        :root {
            --bg-main: #020617;
            --panel-bg: rgba(15, 23, 42, 0.85);
            --panel-border: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.6);
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
            --purple: #8b5cf6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Consolas', 'Courier New', monospace; user-select: none; }

        body {
            background: radial-gradient(circle at center, #0f172a 0%, var(--bg-main) 100%);
            color: var(--text-main); display: flex; height: 100vh; overflow: hidden;
        }

        /* Scanline Overlay for SCADA effect */
        body::before {
            content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100; background-size: 100% 4px, 6px 100%; pointer-events: none; opacity: 0.5;
        }

        /* Sidebar UI */
        #sidebar {
            width: 400px; background: var(--panel-bg); border-right: 1px solid var(--panel-border);
            display: flex; flex-direction: column; z-index: 10; box-shadow: 10px 0 30px rgba(0,0,0,0.9);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
        }
        
        #viewport { flex: 1; position: relative; }

        /* SCADA HUD */
        .sidebar-header {
            padding: 25px 20px; border-bottom: 1px solid var(--panel-border);
            font-weight: bold; font-size: 1.2rem; color: var(--accent);
            text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 12px var(--accent-glow);
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }
        
        /* Navigation (Top half of sidebar) */
        #nav-container {
            display: flex; flex-wrap: wrap; padding: 10px; border-bottom: 2px solid var(--panel-border);
            background: rgba(0,0,0,0.2); flex-shrink: 0;
        }
        
        .nav-btn {
            background: rgba(30, 41, 59, 0.5); border: 1px solid #334155; color: var(--text-muted);
            padding: 10px; margin: 4px; text-align: center; cursor: pointer; flex: 1 1 45%;
            transition: all 0.2s ease; font-size: 0.8rem; letter-spacing: 1px; border-radius: 4px;
        }
        .nav-btn:hover { background: rgba(56, 189, 248, 0.1); color: var(--text-main); }
        .nav-btn.active { background: rgba(56, 189, 248, 0.2); color: var(--text-main); border-color: var(--accent); font-weight: bold; box-shadow: 0 0 10px var(--accent-glow); }

        /* Module Info Panel (Bottom half of sidebar) */
        #module-info {
            padding: 20px; overflow-y: auto; flex-grow: 1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        #module-info::-webkit-scrollbar { width: 6px; }
        #module-info::-webkit-scrollbar-track { background: transparent; }
        #module-info::-webkit-scrollbar-thumb { background: var(--panel-border); border-radius: 3px; }
        #module-info::-webkit-scrollbar-thumb:hover { background: var(--accent); }

        #info-title {
            font-family: 'Consolas', monospace; font-size: 1.3rem; color: var(--accent);
            margin-bottom: 15px; text-transform: uppercase; border-bottom: 1px dashed var(--text-muted); padding-bottom: 10px;
        }
        
        .info-section { margin-bottom: 15px; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 6px; border-left: 3px solid var(--text-muted); }
        .info-section h4 { font-family: 'Consolas', monospace; font-size: 0.85rem; margin-bottom: 8px; letter-spacing: 1px; }
        .info-section p { font-size: 0.9rem; line-height: 1.5; color: #cbd5e1; }
        
        .color-mech { color: #f8fafc; border-left-color: #94a3b8; }
        .color-in { color: var(--accent); border-left-color: var(--accent); }
        .color-out { color: var(--success); border-left-color: var(--success); }
        .color-rej { color: var(--danger); border-left-color: var(--danger); }

        /* Operation Control Panel (Right floating) */
        #ops-panel {
            position: absolute; top: 25px; right: 25px;
            background: var(--panel-bg); border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 20px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.1);
            backdrop-filter: blur(15px); z-index: 20; min-width: 280px;
        }
        .ops-header {
            font-family: 'Consolas', monospace; font-size: 0.8rem; color: var(--accent); margin-bottom: 15px;
            text-transform: uppercase; border-bottom: 1px solid var(--panel-border); padding-bottom: 8px;
            letter-spacing: 2px; display: flex; justify-content: space-between; align-items: center;
        }
        .ops-header::after { content: '● LIVE'; color: var(--danger); font-size: 0.7rem; animation: blink 1.5s infinite; letter-spacing: 1px;}
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }

        .ops-btn {
            display: block; width: 100%; background: rgba(30, 41, 59, 0.8); border: 1px solid #334155;
            color: #cbd5e1; padding: 12px 15px; margin-bottom: 10px; cursor: pointer;
            text-transform: uppercase; font-weight: bold; font-size: 0.8rem;
            transition: all 0.3s; border-radius: 4px; text-align: left;
            position: relative; overflow: hidden; letter-spacing: 0.5px;
        }
        .ops-btn:hover { background: #334155; transform: translateX(-2px); }
        
        .ops-btn.active-service { background: rgba(16, 185, 129, 0.15); border-color: var(--success); color: var(--success); box-shadow: inset 4px 0 0 var(--success); }
        .ops-btn.active-reject { background: rgba(239, 68, 68, 0.15); border-color: var(--danger); color: var(--danger); box-shadow: inset 4px 0 0 var(--danger); }
        .ops-btn.active-regen { background: rgba(139, 92, 246, 0.15); border-color: var(--purple); color: var(--purple); box-shadow: inset 4px 0 0 var(--purple); }

        #flow-desc {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px 30px; border-radius: 30px; color: #e2e8f0; pointer-events: none;
            text-align: center; width: auto; max-width: 70%; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            font-family: 'Segoe UI', sans-serif; font-size: 0.95rem; line-height: 1.6; backdrop-filter: blur(10px);
        }
        
        .valve-legend {
            position: absolute; bottom: 25px; left: 420px; background: var(--panel-bg);
            padding: 15px; border-radius: 8px; border: 1px solid var(--panel-border);
            font-size: 0.8rem; color: var(--text-muted); display: flex; flex-direction: column; gap: 8px;
            backdrop-filter: blur(10px); z-index: 10;
        }
        .v-indicator { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }

        #canvas-container { width: 100%; height: 100%; outline: none; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <nav id="sidebar">
        <div class="sidebar-header">WTP_D-TWIN <span style="font-size:0.7rem; color:var(--text-muted); text-shadow:none;">V5.0</span></div>
        <div id="nav-container">
            <!-- Nav buttons injected here -->
        </div>
        <div id="module-info">
            <h3 id="info-title">MODUL_NAME</h3>
            <div class="info-section color-mech">
                <h4>// MEKANISME PROSES</h4>
                <p id="info-mech">...</p>
            </div>
            <div class="info-section color-in">
                <h4>>> INPUT (UMPAN)</h4>
                <p id="info-in">...</p>
            </div>
            <div class="info-section color-out">
                <h4>>> OUTPUT (PRODUK)</h4>
                <p id="info-out">...</p>
            </div>
            <div class="info-section color-rej">
                <h4>>> REJECT (LIMBAH)</h4>
                <p id="info-rej">...</p>
            </div>
        </div>
    </nav>

    <main id="viewport">
        <div id="canvas-container"></div>
        <div id="ops-panel">
            <div class="ops-header">Control Sequence</div>
            <div id="btn-container"></div>
        </div>
        <div class="valve-legend">
            <span style="color:var(--accent); font-weight:bold; margin-bottom:5px; font-family:'Consolas',monospace;">VALVE STATUS:</span>
            <span style="font-family:'Consolas',monospace;"><span class="v-indicator" style="background:var(--success); box-shadow: 0 0 8px var(--success)"></span>OPEN (Flowing)</span>
            <span style="font-family:'Consolas',monospace;"><span class="v-indicator" style="background:var(--danger); box-shadow: 0 0 8px var(--danger)"></span>CLOSED (Blocked)</span>
        </div>
        <div id="flow-desc">
            <div id="flow-text">Inisialisasi Sistem...</div>
        </div>
    </main>

    <script>
        // --- DATA & CONTENT (FULL END-TO-END EXPLANATION) ---
        const wtpData = [
            { id: 1, name: "CLARIFIER", builder: buildClarifier, 
              mech: "Tahap pertama untuk menjinakkan air baku yang keruh. Mengandalkan gaya gravitasi dan bantuan bahan kimia. Air disuntik dengan Koagulan (PAC) dan Flokulan (Polimer) agar kotoran menggumpal membentuk <b>Flok</b>. Air dimasukkan ke tangki raksasa yang alirannya sangat pelan, membiarkan gaya gravitasi menarik flok berat ke dasar, sementara air jernih meluap perlahan ke atas.",
              input: "• Air Baku (Raw Water)<br>• Koagulan & Flokulan",
              output: "• Air Jernih (Clarified Water)",
              reject: "• Lumpur padat (Sludge) dibuang via *blowdown* bawah.",
              modes: [
                { id: 'service', type: 'service', label: '1. NORMAL SERVICE', desc: '<b>[SERVICE]</b> Air baku dipompa ke pusat (Center Well). Kecepatan air dikurangi drastis, membiarkan flok berat mengendap. Air jernih meluap perlahan ke sisi luar.' },
                { id: 'desludge', type: 'reject', label: '2. BLOWDOWN SLUDGE', desc: '<b>[DESLUDGE]</b> Lengan Scraper mengumpulkan lumpur pekat ke dasar kerucut. Valve Drain terbuka menyedot lumpur keluar.' }
            ]},
            { id: 2, name: "MMF FILTER", builder: buildMMF, 
              mech: "Tangki bertekanan berisi media penyaring berlapis. Menggunakan <b>Antrasit</b> di lapisan atas untuk menjebak kotoran kasar, <b>Pasir Silika</b> di tengah untuk kotoran medium, dan <b>Garnet</b> (sangat halus) di dasar untuk menahan sisa partikel yang lolos dari Clarifier.",
              input: "• Clarified Water",
              output: "• Filtered Water (Bebas partikel makro & TSS).",
              reject: "• Air Backwash kotor (membuang endapan pasir ke drainase).",
              modes: [
                { id: 'service', type: 'service', label: '1. DOWNFLOW SERVICE', desc: '<b>[SERVICE]</b> Filtrasi fisik absolut. Air bertekanan menembus pori-pori Antrasit dan Pasir Silika dari atas ke bawah.' },
                { id: 'backwash', type: 'reject', label: '2. UPFLOW BACKWASH', desc: '<b>[BACKWASH]</b> Arah aliran dibalik! Air bertekanan disemprot dari bawah mengekspansi media penyaring, membuang lumpur terjebak ke atas.' }
            ]},
            { id: 3, name: "ACTIVATED CARBON", builder: buildACF, 
              mech: "Sistem adsorpsi (penyerapan) molekuler, bukan penyaring fisik. Tangki ini penuh berisi <b>Karbon Aktif</b> dengan pori-pori mikroskopis. Tugas krusialnya adalah mengikat <b>Klorin Bebas</b>, bau, dan warna organik agar tidak merusak membran polimer RO di hilir.",
              input: "• Filtered Water (yang mengandung Klorin)",
              output: "• De-chlorinated Water (Air bebas Klorin).",
              reject: "• Sisa serpihan debu karbon (awal *rinse*).",
              modes: [
                { id: 'service', type: 'service', label: '1. ADSORPTION SERVICE', desc: '<b>[SERVICE]</b> Luas permukaan mikroskopis Karbon Aktif secara kimiawi mengikat klorin bebas untuk melindungi membran RO.' },
                { id: 'backwash', type: 'reject', label: '2. MEDIA BACKWASH', desc: '<b>[BACKWASH]</b> Mengurai kepadatan (compaction) ranjang karbon dan membuang debu karbon halus.' }
            ]},
            { id: 4, name: "ION SOFTENER", builder: buildSoftener, 
              mech: "Sistem pertukaran ion (*Ion Exchange*) untuk menghilangkan Kesadahan (*Hardness*). Manik <b>Resin Kation</b> bermuatan Sodium (Na) akan menarik ion Kalsium dan Magnesium (penyebab kerak kapur/scaling) dari air dan menukarnya dengan Sodium yang ramah terhadap perpipaan.",
              input: "• De-chlorinated Water<br>• Injeksi Garam (NaCl) saat Regenerasi",
              output: "• Soft Water (Air Lunak bebas Kalsium/Magnesium).",
              reject: "• Limbah Kalsium Klorida pekat (Saat Regenerasi).",
              modes: [
                { id: 'service', type: 'service', label: '1. SOFTENING SERVICE', desc: '<b>[SERVICE]</b> Resin Kation menangkap ion Kalsium & Magnesium penyebab kerak, menukarnya dengan Sodium murni.' },
                { id: 'regen', type: 'regen', label: '2. BRINE REGEN', desc: '<b>[REGENERATION]</b> Valve injeksi terbuka. Cairan garam (Brine) pekat menyapu resin, secara paksa melepas Kalsium menjadi limbah merah.' }
            ]},
            { id: 5, name: "ULTRAFILTRATION", builder: buildUF, 
              mech: "Masuk ke tahap penyaringan mikroskopis menggunakan modul membran <b>Hollow Fiber</b> berpori 0.01 mikron. Memutus rantai patogen, koloid, silika, dan bakteri 100%. Sistem <i>Cross-flow</i> digunakan agar membran tidak mudah buntu.",
              input: "• Soft Water (Tekanan pompa sedang)",
              output: "• UF Permeate (Air steril, SDI < 3).",
              reject: "• Reject / Konsentrat yang menyapu permukaan membran.",
              modes: [
                { id: 'service', type: 'service', label: '1. CROSS-FLOW SERVICE', desc: '<b>[SERVICE]</b> Air melintasi ribuan serat berongga. Air murni menembus dinding 0.01 mikron, Reject menyapu kotoran permukaan.' },
                { id: 'backwash', type: 'reject', label: '2. MEMBRANE BACKWASH', desc: '<b>[BACKWASH]</b> Air bersih dipompa balik dari dalam serat (Inside-Out) untuk mendobrak kotoran yang menempel di pori-pori luar.' }
            ]},
            { id: 6, name: "REVERSE OSMOSIS", builder: buildRO, 
              mech: "Jantung dari plant demineralisasi. Membran <i>spiral-wound</i> berpori ekstrem <b>0.0001 mikron</b>. Menggunakan pompa bertekanan sangat tinggi untuk melawan efek osmosis alami, menyaring hingga 99% ion mineral, garam, dan logam terlarut (TDS).",
              input: "• UF Permeate<br>• Bahan kimia *Antiscalant*<br>• Tekanan Sangat Tinggi",
              output: "• RO Permeate (Air nyaris murni, TDS rendah).",
              reject: "• Brine (Limbah garam dengan konsentrasi yang sangat pekat).",
              modes: [
                { id: 'service', type: 'service', label: '1. HIGH-PRESS SERVICE', desc: '<b>[SERVICE]</b> Pompa bertekanan ekstrem memaksa air melawan osmosis. 99% garam mineral tertahan dan dibuang (Brine).' },
                { id: 'flush', type: 'reject', label: '2. LOW-PRESS FLUSH', desc: '<b>[FLUSHING]</b> PCV dibuka penuh. Tekanan diturunkan untuk membilas membran dengan aliran deras agar garam tidak mengerak.' }
            ]},
            { id: 7, name: "MIXED BED DEMIN", builder: buildMixedBed, 
              mech: "Tahap *Polishing* pemurnian absolut untuk industri berat (misal: *Boiler* pembangkit listrik). Campuran homogen antara <b>Resin Kation (Asam/H+)</b> dan <b>Resin Anion (Basa/OH-)</b> menangkap 1% sisa ion mineral yang lolos dari RO, mengubahnya seketika menjadi molekul H2O (Air Ultra-Murni).",
              input: "• RO Permeate<br>• Bahan Kimia Regenerasi (HCl & NaOH)",
              output: "• Ultrapure Water (Air tanpa mineral, Konduktivitas < 0.1 µS).",
              reject: "• Limbah basuhan asam dan basa hasil pemisahan resin.",
              modes: [
                { id: 'service', type: 'service', label: '1. POLISHING SERVICE', desc: '<b>[SERVICE]</b> Resin Kation (H+) dan Anion (OH-) bercampur, merubah sisa ion menjadi molekul H2O murni.' },
                { id: 'separation', type: 'reject', label: '2. RESIN SEPARATION', desc: '<b>[SEPARATION]</b> Air didorong dari bawah untuk memisahkan resin berdasarkan berat: Anion mengapung di atas, Kation turun ke bawah.' },
                { id: 'regen', type: 'regen', label: '3. ACID/BASE REGEN', desc: '<b>[REGENERATION]</b> Injeksi Basa (NaOH - Ungu) dari atas, Asam (HCl - Oranye) dari dasar. Bertemu di kolektor tengah jadi limbah netral.' }
            ]}
        ];

        // --- 1. ENGINE & ENVIRONMENT SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2; 

        // Pro-Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 0.3));
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 0.6);
        hemiLight.position.set(0, 20, 0); scene.add(hemiLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(15, 30, -15);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 100;
        dirLight.shadow.camera.left = -20; dirLight.shadow.camera.right = 20;
        dirLight.shadow.camera.top = 20; dirLight.shadow.camera.bottom = -20;
        dirLight.shadow.bias = -0.001;
        scene.add(dirLight);

        // --- 2. ADVANCED MATERIALS ---
        function createStripeTexture() {
            const canvas = document.createElement('canvas'); canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#f59e0b'; ctx.fillRect(0,0,256,256);
            ctx.fillStyle = '#1e293b';
            for(let i=-256; i<512; i+=64) {
                ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i+256, 256);
                ctx.lineTo(i+256+32, 256); ctx.lineTo(i+32, 0); ctx.fill();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(4, 0.2);
            return tex;
        }

        const stripeMat = new THREE.MeshStandardMaterial({ map: createStripeTexture(), roughness: 0.8 });
        const darkSteel = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.6, metalness: 0.6 });
        const pipePVC = new THREE.MeshPhysicalMaterial({ color: 0x334155, transmission: 0.6, opacity: 0.9, transparent: true, roughness: 0.2, metalness: 0.1 });
        const pipeSolid = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5, metalness: 0.3 });
        
        const glassMat = new THREE.MeshPhysicalMaterial({ 
            color: 0xe0f2fe, transmission: 0.95, ior: 1.5, thickness: 0.8, 
            roughness: 0.05, metalness: 0.1, transparent: true, side: THREE.DoubleSide 
        });

        // --- 3. SYSTEM STATE ---
        let currentGroup = new THREE.Group(); scene.add(currentGroup);
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: 0x020617, roughness: 0.1, metalness: 0.5 }));
        floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

        let valves = {};         
        let particleGroups = {}; 

        // --- 4. COMPONENTS BUILDERS ---

        function createGauge(position, rotation) {
            const group = new THREE.Group();
            const body = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.1, 16), darkSteel); body.rotation.x = Math.PI/2;
            const face = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 0.12, 16), new THREE.MeshBasicMaterial({color: 0xffffff})); face.rotation.x = Math.PI/2;
            const needle = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.15, 0.02), new THREE.MeshBasicMaterial({color: 0xef4444}));
            needle.position.set(0, 0, 0.06); needle.rotation.z = -Math.PI/4;
            group.add(body, face, needle);
            group.position.copy(position); group.rotation.copy(rotation);
            return group;
        }

        function createValve(position, rotationAxis, angle, id) {
            const vGroup = new THREE.Group();
            const flangeGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
            const f1 = new THREE.Mesh(flangeGeo, darkSteel); f1.position.y = 0.3; vGroup.add(f1);
            const f2 = new THREE.Mesh(flangeGeo, darkSteel); f2.position.y = -0.3; vGroup.add(f2);
            vGroup.add(new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.6, 16), darkSteel));

            const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.6, 8), new THREE.MeshStandardMaterial({color: 0x94a3b8}));
            stem.rotation.x = Math.PI/2; stem.position.z = 0.4; vGroup.add(stem);
            
            const wheel = new THREE.Group();
            wheel.add(new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.04, 8, 16), darkSteel));
            const cross = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.04, 0.04), darkSteel);
            const cross2 = cross.clone(); cross2.rotation.z = Math.PI/2;
            wheel.add(cross, cross2);
            wheel.rotation.x = Math.PI/2; wheel.position.z = 0.7; vGroup.add(wheel);

            const led = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.1, 16), new THREE.MeshBasicMaterial({color: 0xef4444}));
            led.rotation.x = Math.PI/2; led.position.z = 0.7; vGroup.add(led);
            vGroup.add(createGauge(new THREE.Vector3(0, 0.4, 0), new THREE.Euler(0, 0, 0)));

            vGroup.position.copy(position);
            if(rotationAxis === 'x') vGroup.rotation.x = angle;
            else if(rotationAxis === 'z') vGroup.rotation.z = angle;
            else if(rotationAxis === 'y') vGroup.rotation.y = angle;

            vGroup.setOpen = (isOpen) => { 
                led.material.color.setHex(isOpen ? 0x10b981 : 0xef4444); 
                if(isOpen) wheel.rotation.z = Math.PI/4; else wheel.rotation.z = 0;
            };
            valves[id] = vGroup; currentGroup.add(vGroup);
            return vGroup;
        }

        function buildStaticPipe(points, radius) {
            for(let i=0; i<points.length-1; i++) {
                const p1 = points[i], p2 = points[i+1], dist = p1.distanceTo(p2);
                const pipe = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, dist, 16), pipePVC);
                pipe.position.copy(p1).lerp(p2, 0.5);
                const rot = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), p2.clone().sub(p1).normalize());
                pipe.quaternion.copy(rot); pipe.castShadow = true; currentGroup.add(pipe);
                
                const elbow = new THREE.Mesh(new THREE.SphereGeometry(radius*1.1, 16, 16), pipeSolid);
                elbow.position.copy(p1); elbow.castShadow = true; currentGroup.add(elbow);
                
                if(i > 0) {
                    const flange = new THREE.Mesh(new THREE.CylinderGeometry(radius*1.4, radius*1.4, 0.05, 16), darkSteel);
                    flange.position.copy(p1); flange.quaternion.copy(rot); flange.castShadow = true; currentGroup.add(flange);
                }
            }
            const finalElbow = new THREE.Mesh(new THREE.SphereGeometry(radius*1.1, 16, 16), pipeSolid);
            finalElbow.position.copy(points[points.length-1]); currentGroup.add(finalElbow);
        }

        function registerFlow(modeId, points, radius, colorHex, speed = 0.02) {
            if(!particleGroups[modeId]) particleGroups[modeId] = [];
            const flowData = { segments: [], totalLength: 0, particles: [], speed, color: colorHex };
            for(let i=0; i<points.length-1; i++) {
                const l = points[i].distanceTo(points[i+1]);
                flowData.segments.push({ p1: points[i], p2: points[i+1], length: l });
                flowData.totalLength += l;
            }
            const group = new THREE.Group(); group.visible = false;
            
            const numParticles = Math.floor(flowData.totalLength * 4);
            const pMat = new THREE.MeshBasicMaterial({ color: colorHex, transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false });
            
            for(let i=0; i<numParticles; i++) {
                const mesh = new THREE.Mesh(new THREE.CylinderGeometry(radius*0.2, radius*0.2, radius*1.5, 8), pMat);
                flowData.particles.push({ mesh, progress: i / numParticles });
                group.add(mesh);
            }
            particleGroups[modeId].push(flowData); currentGroup.add(group); flowData.group = group;
        }

        }

        function activateMode(moduleConfig, mode) {
            document.querySelectorAll('.ops-btn').forEach(b => b.className = 'ops-btn');
            document.getElementById(`btn-mode-${mode.id}`).classList.add(`active-${mode.type}`);
            document.getElementById('flow-text').innerHTML = mode.desc;

            Object.values(particleGroups).forEach(groupArray => { groupArray.forEach(flow => flow.group.visible = false); });
            if(particleGroups[mode.id]) particleGroups[mode.id].forEach(flow => flow.group.visible = true);
            Object.keys(valves).forEach(id => valves[id].setOpen(false));

            if(moduleConfig.id === 1) { 
                if(mode.id === 'service') { valves['V_IN'].setOpen(true); valves['V_OUT'].setOpen(true); }
                if(mode.id === 'desludge') { valves['V_IN'].setOpen(true); valves['V_OUT'].setOpen(true); valves['V_SLUDGE'].setOpen(true); }
            }
            if(moduleConfig.id === 2 || moduleConfig.id === 3) {
                if(mode.id === 'service') { valves['V_IN'].setOpen(true); valves['V_OUT'].setOpen(true); }
                if(mode.id === 'backwash') { valves['V_BW_IN'].setOpen(true); valves['V_BW_OUT'].setOpen(true); }
            }
            if(moduleConfig.id === 4) {
                if(mode.id === 'service') { valves['V_IN'].setOpen(true); valves['V_OUT'].setOpen(true); }
                if(mode.id === 'regen') { valves['V_BRINE'].setOpen(true); valves['V_DRAIN_BOT'].setOpen(true); }
            }
            if(moduleConfig.id === 5 || moduleConfig.id === 6) {
                if(mode.id === 'service') { valves['V_IN'].setOpen(true); valves['V_OUT'].setOpen(true); valves['V_REJ'].setOpen(true); }
                if(mode.id === 'backwash' || mode.id === 'flush') { valves['V_IN'].setOpen(true); valves['V_REJ'].setOpen(true); }

        // Animation calculations
        function getPositionAlongPath(flowData, progress) {
            const targetDist = progress * flowData.totalLength; let currentDist = 0;
            for(let i=0; i<flowData.segments.length; i++) {
                const seg = flowData.segments[i];
                if(targetDist <= currentDist + seg.length) {
                    const localProg = (targetDist - currentDist) / seg.length;
                    return seg.p1.clone().lerp(seg.p2, localProg);
                }
                currentDist += seg.length;
            }
            return flowData.segments[flowData.segments.length-1].p2.clone();
        }

        function getRotationAlongPath(flowData, progress) {
            const targetDist = progress * flowData.totalLength; let currentDist = 0;
            for(let i=0; i<flowData.segments.length; i++) {
                const seg = flowData.segments[i];
                if(targetDist <= currentDist + seg.length) {
                    const dir = seg.p2.clone().sub(seg.p1).normalize();
                    return new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
                }
                currentDist += seg.length;
            }
            return new THREE.Quaternion();
        }

        function animate() {
            requestAnimationFrame(animate); controls.update();
            Object.values(particleGroups).forEach(groupArray => {
                groupArray.forEach(flow => {
                    if(flow.group.visible) {
                        flow.particles.forEach(p => {
                            p.progress += flow.speed; if(p.progress > 1) p.progress = 0;
                            p.mesh.position.copy(getPositionAlongPath(flow, p.progress));
                            p.mesh.quaternion.copy(getRotationAlongPath(flow, p.progress));
                        });
                    }
                });
            });
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix(); renderer.setSize(container.clientWidth, container.clientHeight);
        });

        loadModule(1); // Default to start at Clarifier
        animate();
    </script>
</body>
</html>
